<!DOCTYPE html>
<!--
  TrumpTweets — open in any browser
  Best served locally to avoid CORS blocks:
    python -m http.server 8080
    → http://localhost:8080/trump_tweets.html
  Firefox also works by opening the file directly (file://).
-->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="dark">
<title>TrumpTweets</title>
<style>
  :root {
    --bg:          #0d1117;
    --bg-card:     #161b22;
    --border:      #30363d;
    --border-glow: rgba(88,166,255,.18);
    --text:        #e6edf3;
    --muted:       #8b949e;
    --blue:        #58a6ff;
    --red:         #f85149;
    --green:       #3fb950;
    --truth-bg:    #0e2318;
    --truth-fg:    #3fb950;
    --twitter-bg:  #0e1d33;
    --twitter-fg:  #58a6ff;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
                 "Helvetica Neue", Arial, sans-serif;
    font-size: 15px;
    line-height: 1.6;
  }

  /* ── Header ─────────────────────────────────────────── */
  header {
    position: sticky; top: 0; z-index: 50;
    height: 52px;
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 20px;
    background: rgba(13,17,23,.9);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--border);
  }
  .logo { font-weight: 700; font-size: 17px; letter-spacing: -.3px; }
  .logo em { font-style: normal; color: var(--muted); font-weight: 400; font-size: 13px; margin-left: 8px; }
  #refresh-info {
    font-size: 12px; color: var(--muted);
    display: flex; align-items: center; gap: 7px;
  }
  .live-dot {
    width: 7px; height: 7px; border-radius: 50%;
    background: var(--green);
    animation: blink 2s ease-in-out infinite;
  }
  @keyframes blink { 0%,100%{opacity:1} 50%{opacity:.25} }

  /* ── Source bar ──────────────────────────────────────── */
  .src-bar {
    display: flex; gap: 8px;
    padding: 10px 20px;
    border-bottom: 1px solid var(--border);
    overflow-x: auto; -webkit-overflow-scrolling: touch;
  }
  .src-btn {
    padding: 5px 16px; border-radius: 20px;
    border: 1px solid var(--border);
    background: transparent; color: var(--muted);
    cursor: pointer; font-size: 13px; font-family: inherit;
    white-space: nowrap;
    transition: color .15s, border-color .15s, background .15s;
    user-select: none;
  }
  .src-btn:hover { border-color: var(--blue); color: var(--blue); }
  .src-btn.on { background: var(--blue); border-color: var(--blue); color: #0d1117; font-weight: 600; }

  /* ── Feed ────────────────────────────────────────────── */
  #feed {
    max-width: 640px; margin: 0 auto;
    padding: 18px 14px;
    display: flex; flex-direction: column; gap: 12px;
  }

  /* ── Post card ───────────────────────────────────────── */
  .card {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 15px 17px;
    transition: border-color .2s;
    animation: rise .2s ease both;
  }
  .card:hover { border-color: var(--border-glow); }
  @keyframes rise { from{opacity:0;transform:translateY(-4px)} to{opacity:1;transform:none} }

  .card-head {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 10px;
  }
  .card-time { font-size: 12px; color: var(--muted); }
  .badge {
    font-size: 11px; font-weight: 500;
    padding: 2px 9px; border-radius: 10px;
  }
  .badge.truth   { background: var(--truth-bg);   color: var(--truth-fg); }
  .badge.twitter { background: var(--twitter-bg); color: var(--twitter-fg); }

  .card-body {
    font-size: 15px; line-height: 1.7;
    color: var(--text);
    white-space: pre-wrap; word-break: break-word;
  }
  .card-foot {
    display: flex; align-items: center; gap: 14px;
    margin-top: 12px;
  }
  .stat       { font-size: 13px; color: var(--muted); }
  .stat.h     { color: var(--red); }
  .stat.rt    { color: var(--green); }
  a.ext {
    margin-left: auto; font-size: 12px;
    color: var(--muted); text-decoration: none;
    transition: color .15s;
  }
  a.ext:hover { color: var(--blue); }

  /* ── States ──────────────────────────────────────────── */
  .spinner-wrap { text-align: center; padding: 60px 0; }
  .spinner {
    display: inline-block; width: 26px; height: 26px;
    border: 2px solid var(--border); border-top-color: var(--blue);
    border-radius: 50%; animation: spin .7s linear infinite;
  }
  @keyframes spin { to{transform:rotate(360deg)} }
  .empty  { text-align: center; padding: 60px 0; color: var(--muted); font-size: 14px; }
  .errmsg { text-align: center; padding: 40px 14px; color: var(--red);  font-size: 13px; line-height: 1.8; }
  .errmsg code { background: var(--bg-card); padding: 2px 6px; border-radius: 4px; font-size: 12px; color: var(--muted); }

  /* ── Stats footer ────────────────────────────────────── */
  #stats {
    max-width: 640px; margin: 2px auto 36px;
    padding: 11px 16px;
    background: var(--bg-card); border: 1px solid var(--border);
    border-radius: 10px; font-size: 12px; color: var(--muted);
    display: flex; flex-wrap: wrap; gap: 4px 16px;
  }
  #stats b { color: var(--text); font-weight: 500; }
</style>
</head>
<body>

<header>
  <div class="logo">TrumpTweets <em>filtered feed</em></div>
  <div id="refresh-info">
    <div class="live-dot"></div>
    refreshing in <strong id="cd">60</strong>s
  </div>
</header>

<div class="src-bar">
  <button class="src-btn on" data-s="auto"        onclick="pick(this,'auto')">Auto</button>
  <button class="src-btn"    data-s="truthsocial" onclick="pick(this,'truthsocial')">Truth Social</button>
  <button class="src-btn"    data-s="twitter"     onclick="pick(this,'twitter')">&#120143; Twitter</button>
</div>

<div id="feed"><div class="spinner-wrap"><div class="spinner"></div></div></div>
<div id="stats" style="display:none"></div>

<script>
"use strict";

/* ── config ────────────────────────────────────────────────────── */
const HANDLE  = 'realDonaldTrump';
const TS_BASE = 'https://truthsocial.com/api/v1';
const NITTER  = ['nitter.net','nitter.privacydev.net','nitter.poast.org','nitter.1d4.us','nitter.unixfox.eu'];

/* ── util ──────────────────────────────────────────────────────── */
const esc = s => s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');

function fmtN(n) {
  if (!n) return '';
  return n >= 1e6 ? (n/1e6).toFixed(1)+'M' : n >= 1e3 ? (n/1e3).toFixed(1)+'K' : String(n);
}

function fmtTime(raw) {
  if (!raw) return '';
  try {
    const d = new Date(raw);
    if (isNaN(d)) return raw.slice(0,10);
    return d.toLocaleString('en-US',{month:'short',day:'numeric',hour:'numeric',minute:'2-digit',hour12:true});
  } catch(_) { return raw.slice(0,10); }
}

function stripHtml(html) {
  if (!html) return '';
  try {
    const doc = new DOMParser().parseFromString(html,'text/html');
    return (doc.body.textContent||'').replace(/\n{3,}/g,'\n\n').trim();
  } catch(_) {
    return html.replace(/<[^>]+>/g,'').trim();
  }
}

/* ── HTTP w/ CORS proxy fallback ───────────────────────────────── */
async function getJson(url) {
  const sig = () => AbortSignal.timeout(8000);

  // 1 — direct (works from localhost or if server has permissive CORS)
  try {
    const r = await fetch(url, {headers:{Accept:'application/json'}, signal:sig()});
    if (r.ok) return r.json();
  } catch(_) {}

  // 2 — corsproxy.io
  try {
    const r = await fetch('https://corsproxy.io/?'+encodeURIComponent(url), {signal:sig()});
    if (r.ok) return r.json();
  } catch(_) {}

  // 3 — allorigins.win (wraps response in {contents:"..."})
  try {
    const r = await fetch('https://api.allorigins.win/get?url='+encodeURIComponent(url), {signal:sig()});
    if (r.ok) { const j = await r.json(); return JSON.parse(j.contents); }
  } catch(_) {}

  throw new Error('fetch failed: '+url);
}

async function getXml(url) {
  const sig = () => AbortSignal.timeout(8000);

  // try proxies first for RSS (direct cross-origin XML almost never has CORS headers)
  try {
    const r = await fetch('https://corsproxy.io/?'+encodeURIComponent(url), {signal:sig()});
    if (r.ok) return r.text();
  } catch(_) {}

  try {
    const r = await fetch('https://api.allorigins.win/get?url='+encodeURIComponent(url), {signal:sig()});
    if (r.ok) { const j = await r.json(); return j.contents; }
  } catch(_) {}

  // direct last (Firefox file:// allows it sometimes)
  try {
    const r = await fetch(url, {signal:sig()});
    if (r.ok) return r.text();
  } catch(_) {}

  throw new Error('xml fetch failed: '+url);
}

/* ── sources ───────────────────────────────────────────────────── */
let _tsId = null;

async function fromTruthSocial() {
  if (!_tsId) {
    const d = await getJson(`${TS_BASE}/accounts/lookup?acct=${HANDLE}`);
    _tsId = d.id;
  }
  const posts = await getJson(`${TS_BASE}/accounts/${_tsId}/statuses?limit=40&exclude_replies=true`);
  return { posts, label: 'Truth Social' };
}

function parseRss(xml) {
  const doc   = new DOMParser().parseFromString(xml, 'text/xml');
  const items = [...doc.querySelectorAll('item')];
  return items.map(item => {
    const desc = item.querySelector('description')?.textContent || '';
    const pub  = item.querySelector('pubDate')?.textContent || '';
    const guid = item.querySelector('guid')?.textContent || '';
    // <link> is a void element in HTML, use getElementsByTagName for reliability
    const linkEls = item.getElementsByTagName('link');
    const url  = (linkEls.length ? linkEls[0].textContent : '') || guid;
    const id   = (guid||url).split('/').pop().replace('#m','');
    const text = stripHtml(desc);
    return {
      id: 'tw_'+id, content: desc,
      created_at: pub ? new Date(pub).toISOString() : '',
      url, favourites_count: 0, reblogs_count: 0,
      reblog: text.trimStart().startsWith('RT @') ? {_rt:true} : null,
      _source: 'twitter',
    };
  });
}

async function fromNitter() {
  let lastErr = 'no instances tried';
  for (const inst of NITTER) {
    try {
      const xml = await getXml(`https://${inst}/${HANDLE}/rss`);
      const posts = parseRss(xml);
      if (posts.length) return { posts, label: `Twitter / ${inst}` };
    } catch(e) { lastErr = e.message; }
  }
  throw new Error('Nitter: '+lastErr);
}

/* ── filtering ─────────────────────────────────────────────────── */
const DONATION_KW = ['winred','actblue','fundrais','donate to','chip in','split between'];
const ENDORSE_KW  = ['endorses ','endorsed ','for congress','for senate','for governor','for house','for mayor'];
const ENDORSE_RE  = /supports \w+ for /i;
const STAFF_PFX   = ['THE PRESIDENT','PRESIDENT TRUMP'];

function why(post, text) {
  if (post.reblog) return 'repost';
  const up = text.toUpperCase();
  if (up.includes('FOR IMMEDIATE RELEASE')) return 'staff';
  if (STAFF_PFX.some(p => up.trimStart().startsWith(p))) return 'staff';
  const lo = text.toLowerCase();
  if (DONATION_KW.some(k => lo.includes(k))) return 'endorsement';
  if (ENDORSE_KW.some(k => lo.includes(k))) return 'endorsement';
  if (ENDORSE_RE.test(text)) return 'endorsement';
  return null;
}

/* ── render ────────────────────────────────────────────────────── */
function renderCard(p) {
  const cls   = p._source === 'twitter' ? 'twitter' : 'truth';
  const badge = p._source === 'twitter' ? '&#120143;&nbsp;Twitter' : 'Truth Social';
  const faves = p.favourites_count ? `<span class="stat h">&#10084; ${fmtN(p.favourites_count)}</span>` : '';
  const rbs   = p.reblogs_count   ? `<span class="stat rt">&#8635; ${fmtN(p.reblogs_count)}</span>` : '';
  const link  = p.url ? `<a class="ext" href="${esc(p.url)}" target="_blank" rel="noopener">&#8599;&nbsp;open</a>` : '';
  return `<div class="card">
    <div class="card-head">
      <span class="card-time">${esc(fmtTime(p.created_at))}</span>
      <span class="badge ${cls}">${badge}</span>
    </div>
    <div class="card-body">${esc(p._text)}</div>
    <div class="card-foot">${faves}${rbs}${link}</div>
  </div>`;
}

function renderStats(label, s) {
  const sf = document.getElementById('stats');
  sf.style.display = 'flex';
  sf.innerHTML = [
    ['source',       label],
    ['fetched',      s.fetched],
    ['shown',        s.shown],
    ['filtered',     s.filtered],
    ['reposts',      s.repost],
    ['endorsements', s.endorsement],
    ['staff posts',  s.staff],
  ].map(([l,v]) => `<span>${l} <b>${v}</b></span>`).join('');
}

/* ── load ──────────────────────────────────────────────────────── */
let activeSrc = 'auto';

async function load() {
  document.getElementById('feed').innerHTML = '<div class="spinner-wrap"><div class="spinner"></div></div>';

  const fetchers = activeSrc === 'truthsocial' ? [fromTruthSocial]
                 : activeSrc === 'twitter'     ? [fromNitter]
                 : [fromTruthSocial, fromNitter];

  let raw = null, label = '';
  const errors = [];
  for (const fn of fetchers) {
    try { ({posts:raw, label} = await fn()); break; }
    catch(e) { errors.push(e.message); }
  }

  if (!raw) {
    document.getElementById('feed').innerHTML = `<div class="errmsg">
      Could not load posts.<br><br>
      ${errors.map(e=>`<small>${esc(e)}</small>`).join('<br>')}
      <br><br>
      Tip: CORS blocks browser fetches from <code>file://</code>.<br>
      Serve locally: <code>python -m http.server 8080</code>
      then open <code>http://localhost:8080/trump_tweets.html</code>
    </div>`;
    return;
  }

  const stats = {fetched:raw.length, shown:0, filtered:0, repost:0, endorsement:0, staff:0};
  const posts = [];
  for (const p of raw) {
    if (posts.length >= 20) break;
    const text = stripHtml(p.content || '');
    const reason = why(p, text);
    if (reason) {
      stats.filtered++;
      stats[reason] = (stats[reason]||0) + 1;
    } else {
      posts.push({...p, _text: text});
    }
  }
  stats.shown = posts.length;

  document.getElementById('feed').innerHTML = posts.length
    ? posts.map(renderCard).join('')
    : '<div class="empty">No posts passed filters.</div>';

  renderStats(label, stats);
}

/* ── source picker ─────────────────────────────────────────────── */
function pick(btn, src) {
  activeSrc = src;
  document.querySelectorAll('.src-btn').forEach(b => b.classList.toggle('on', b===btn));
  resetTimer();
  load();
}

/* ── auto-refresh countdown ────────────────────────────────────── */
let timerID, secs = 60;

function resetTimer() {
  clearInterval(timerID);
  secs = 60;
  document.getElementById('cd').textContent = 60;
  timerID = setInterval(() => {
    secs--;
    document.getElementById('cd').textContent = secs;
    if (secs <= 0) { secs = 60; load(); }
  }, 1000);
}

load();
resetTimer();
</script>
</body>
</html>
